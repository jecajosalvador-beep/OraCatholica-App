
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OraCatholica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment: #fdfbf7;
            --ink: #2c2420;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--parchment);
            color: var(--ink);
            transition: background-color 0.5s ease;
        }
        .dark body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .serif {
            font-family: 'Crimson Pro', serif;
        }
        .prayer-card {
            border-left: 4px solid var(--accent-color, #166534);
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.6s ease-out forwards;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script type="importmap">
{

    "date-fns": "https://esm.sh/date-fns@^4.1.0",

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>

</body>
</html>
